# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true

reviews:
  auto_review:
    # The reviewer ladder requests CodeRabbit with a marked `@coderabbitai review` comment when it
    # picks it. A PR nobody requested gets no CodeRabbit review.
    enabled: false
    # Defer review until ready so unfinished changes do not consume the author's allowance.
    drafts: false
